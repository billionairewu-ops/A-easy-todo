name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 忽略 TS 类型错误继续构建
      - name: Build web app
        run: pnpm build || true

      - name: Detect web build output
        id: detect_dist
        shell: bash
        run: |
          set -e

          DIST_DIR=""

          for dir in artifacts/*/dist artifacts/*/build dist build; do
            if [ -d "$dir" ] && [ -f "$dir/index.html" ]; then
              DIST_DIR="$dir"
              break
            fi
          done

          if [ -z "$DIST_DIR" ]; then
            echo "Could not find build output"
            find . -maxdepth 5 -type f -name index.html
            exit 1
          fi

          echo "dist_dir=$DIST_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: |
          pnpm add -Dw @capacitor/core @capacitor/cli @capacitor/android

      - name: Create capacitor config
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.billionairewu.taskdashboard",
            "appName": "Task Dashboard",
            "webDir": "${{ steps.detect_dist.outputs.dist_dir }}"
          }
          EOF

      - name: Create Android Project
        run: |
          pnpm exec cap add android
          pnpm exec cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task-dashboard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
