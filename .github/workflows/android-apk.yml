name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build mobile web app only
        run: |
          cd artifacts/mobile
          pnpm run build

      - name: Detect mobile build output
        id: detect_dist
        shell: bash
        run: |
          set -e

          DIST_DIR=""

          for dir in artifacts/mobile/dist artifacts/mobile/build artifacts/mobile/web-build artifacts/mobile/.output/public; do
            if [ -d "$dir" ] && [ -f "$dir/index.html" ]; then
              DIST_DIR="$dir"
              break
            fi
          done

          if [ -z "$DIST_DIR" ]; then
            echo "Could not find mobile build output containing index.html"
            echo "Available index.html files:"
            find artifacts/mobile -maxdepth 6 -type f -name index.html | sort || true
            echo "Available build-like folders:"
            find artifacts/mobile -maxdepth 4 -type d \( -name dist -o -name build -o -name web-build -o -name public \) | sort || true
            exit 1
          fi

          echo "dist_dir=$DIST_DIR" >> "$GITHUB_OUTPUT"
          echo "Detected mobile build output: $DIST_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: pnpm add -Dw @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.billionairewu.taskdashboard",
            "appName": "Task Dashboard",
            "webDir": "${{ steps.detect_dist.outputs.dist_dir }}"
          }
          EOF

      - name: Create Android project
        run: |
          pnpm exec cap add android
          pnpm exec cap copy android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task-dashboard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
