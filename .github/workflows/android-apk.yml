name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Export Expo web build
        env:
          EXPO_PUBLIC_DOMAIN: task-dashboard--billionairewu.replit.app
          REPLIT_DEV_DOMAIN: task-dashboard--billionairewu.replit.app
          REPLIT_INTERNAL_APP_DOMAIN: task-dashboard--billionairewu.replit.app
        run: |
          cd artifacts/mobile
          pnpm exec expo export --platform web --output-dir dist

      - name: Verify web build output
        run: |
          if [ ! -f artifacts/mobile/dist/index.html ]; then
            echo "Expo web export did not create artifacts/mobile/dist/index.html"
            echo "Files under artifacts/mobile/dist:"
            find artifacts/mobile/dist -maxdepth 4 -type f | sort || true
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: pnpm add -Dw @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<EOF
          {
            "appId": "com.billionairewu.taskdashboard",
            "appName": "Task Dashboard",
            "webDir": "artifacts/mobile/dist"
          }
          EOF

      - name: Create Android project
        run: |
          pnpm exec cap add android
          pnpm exec cap copy android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task-dashboard-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
